name: soloar-system
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Nodejs 
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache npm dependicies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
